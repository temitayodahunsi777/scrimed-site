name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency and license delta review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIMED_RELEASE_CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.sha }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Review dependency changes
        if: vars.SCRIMED_GITHUB_DEPENDENCY_GRAPH_ENABLED == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          license-check: true

      - name: Enforce connector-independent security and license floor
        if: vars.SCRIMED_GITHUB_DEPENDENCY_GRAPH_ENABLED != 'true'
        run: |
          npm audit --audit-level=moderate
          npm run security:dependency-floor
          npm run security:sbom
          echo "::notice::GitHub dependency graph is not declared enabled; deterministic lockfile, advisory, license, and SBOM gates passed."
