name: Execution Attempt Durable Store QA Smoke
run-name: Execution Attempt Durable Store QA Smoke (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production app URL to smoke-test.
        required: true
        default: https://app.scrimedsolutions.com
      workspace_slug:
        description: Explicit protected synthetic workspace slug to verify.
        required: true
        default: atlas-synthetic-evaluation
      require_authenticated_path:
        description: Fail if SCRIMED_BEARER_TOKEN is missing.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: execution-attempt-durable-store-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  durable-store-qa:
    name: Execution attempt durable-store QA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Preflight short-lived AAL2 token
        env:
          SCRIMED_BASE_URL: ${{ inputs.base_url }}
          SCRIMED_BEARER_TOKEN: ${{ secrets.SCRIMED_BEARER_TOKEN }}
          SCRIMED_WORKSPACE_SLUG: ${{ inputs.workspace_slug }}
        run: node scripts/aal2-smoke-readiness-preflight.mjs --strict

      - name: Run execution attempt durable-store QA smoke
        env:
          SCRIMED_BASE_URL: ${{ inputs.base_url }}
          SCRIMED_BEARER_TOKEN: ${{ secrets.SCRIMED_BEARER_TOKEN }}
          SCRIMED_WORKSPACE_SLUG: ${{ inputs.workspace_slug }}
          SCRIMED_REQUIRE_AUTHENTICATED_SMOKE: ${{ inputs.require_authenticated_path && '1' || '' }}
        run: node scripts/execution-attempt-durable-store-authenticated-smoke.mjs --strict

      - name: Evidence capture reminder
        run: |
          {
            echo "## SCRIMED Execution Attempt Durable Store QA Evidence Capture"
            echo ""
            echo "After a passing authenticated run, copy only these non-secret values from the smoke output into /pilot-workspace/access -> Manual QA Evidence:"
            echo ""
            echo "- workflowKind: execution-attempt-durable-store-qa"
            echo "- workflowRunId: this GitHub Actions run ID"
            echo "- intakeId: ${{ inputs.workspace_slug }}"
            echo "- createdSessionId: durable record UUID printed by the smoke"
            echo "- packetAuditEventId: review disposition audit event UUID printed by the smoke"
            echo "- tokenDisposalAttestation: temporary-token-deleted-or-rotated"
            echo ""
            echo "Do not copy bearer tokens, refresh tokens, credentials, PHI, raw execution payloads, payer data, or production credentials."
          } >> "$GITHUB_STEP_SUMMARY"
