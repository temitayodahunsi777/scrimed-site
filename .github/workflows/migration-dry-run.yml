name: Disposable Migration Dry Run

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "config/pending-migration-authorization.json"
      - "scripts/verify-migration-dry-run.mjs"
      - ".github/workflows/migration-dry-run.yml"

permissions:
  contents: read

jobs:
  disposable-postgres:
    name: Apply and recover migrations in disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrimed_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scrimed_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCRIMED_DISPOSABLE_DATABASE: "true"
      SCRIMED_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scrimed_migration_ci
      SCRIMED_SYNTHETIC_ONLY: "true"
      SCRIMED_ALLOW_PHI: "false"
      SCRIMED_LIVE_CLINICAL_EXECUTION: "false"
      SCRIMED_CONSEQUENTIAL_ACTIONS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify isolated target and replay exact migration set
        run: node scripts/verify-migration-dry-run.mjs --execute --strict

      - name: Run migration and application contracts
        run: |
          npm run test:scrimed-work:migration-set-policy
          npm run contract:clinical-assurance-migration
          npm run test:pending-migrations
          npm run smoke:execution-attempt-durable-store

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disposable-migration-evidence-${{ github.run_id }}
          path: artifacts/migrations/disposable-migration-dry-run.json
          if-no-files-found: error
          retention-days: 14
