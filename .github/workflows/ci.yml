name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js site
    runs-on: ubuntu-latest
    env:
      SCRIMED_SBOM_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'scripts/**', 'next.config.js', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Release provenance
        run: npm run release:provenance:strict

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Dependency security floor
        run: npm run security:dependency-floor

      - name: Candidate secret scan
        run: npm run security:secret-scan

      - name: Generate and verify local SBOM evidence
        run: npm run security:sbom

      - name: Generate migration evidence packet
        run: npm run release:migration-packet

      - name: Verify pending migration authorization packet
        run: npm run release:pending-migrations

      - name: Generated workspace integrity
        run: node scripts/check-generated-integrity.mjs

      - name: Execution attempt durable-store contract
        run: npm run smoke:execution-attempt-durable-store

      - name: SCRIMED Work lifecycle and durable-store contracts
        run: |
          npm run test:scrimed-work:lifecycle
          npm run test:scrimed-work:preflight-policy
          npm run test:scrimed-work:browser-verification
          npm run smoke:scrimed-work
          npm run smoke:scrimed-work:durable-store-preflight

      - name: SCRIMED Intelligence & Safety Stack contract
        run: npm run smoke:scrimed-intelligence-safety-stack

      - name: Non-secret SCRIMED contract suite
        run: npm run test:nonsecret

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify public release surfaces
        run: npm run verify:public-release
