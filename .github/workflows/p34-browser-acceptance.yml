name: P34 Pinned Browser Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p34-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SCRIMED_SYNTHETIC_ONLY: "true"
  SCRIMED_ALLOW_PHI: "false"
  SCRIMED_LIVE_CLINICAL_EXECUTION: "false"
  SCRIMED_CONSEQUENTIAL_ACTIONS_ENABLED: "false"
  SCRIMED_EXTERNAL_PROVIDER_CALLS_ENABLED: "false"
  SCRIMED_SCHEDULES_ENABLED: "false"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  browser-acceptance:
    name: Exact candidate desktop and 390px mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate binding
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_CANDIDATE_SHA}"

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact application lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prove pinned native dependency loads without postinstall
        run: node scripts/unrs-resolver-install-script-proof.mjs

      - name: Provision pinned Playwright runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit "playwright@${PLAYWRIGHT_VERSION}"
          npx --no-install playwright install --with-deps chromium
          test "$(npx --no-install playwright --version)" = "Version ${PLAYWRIGHT_VERSION}"

      - name: Build exact synthetic candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: GITHUB_SHA="${EXPECTED_CANDIDATE_SHA}" npm run build

      - name: Start isolated local candidate
        run: |
          mkdir -p artifacts/ui-verification/p34-pinned-ci
          npm run start -- --hostname 127.0.0.1 --port 3000 > artifacts/ui-verification/p34-pinned-ci/server.log 2>&1 &
          echo "$!" > /tmp/scrimed-p34-browser-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/ui-verification/p34-pinned-ci/server.log
          exit 1

      - name: Run strict desktop and 390px mobile acceptance
        run: |
          npm run verify:preview-ui -- \
            --base-url=http://127.0.0.1:3000 \
            --canonical-origin=https://app.scrimedsolutions.com \
            --output-dir=artifacts/ui-verification/p34-pinned-ci \
            --strict \
            --json

      - name: Enforce complete browser evidence
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const path = "artifacts/ui-verification/p34-pinned-ci/preview-ui-verification.json";
            const report = JSON.parse(await readFile(path, "utf8"));
            const desktop = report.results.filter((entry) => entry.viewport === "desktop");
            const mobile = report.results.filter((entry) => entry.viewport === "mobile-390");
            const failures = report.results.flatMap((entry) => entry.failures ?? []);
            if (report.passed !== true || report.results.length !== 16 || desktop.length !== 8 || mobile.length !== 8 || failures.length !== 0) {
              console.error(JSON.stringify({ passed: report.passed, checks: report.results.length, desktop: desktop.length, mobile: mobile.length, failures }, null, 2));
              process.exit(1);
            }
            console.log("pass pinned browser evidence: 8 desktop + 8 mobile-390 + protected review-readiness API");
          '

      - name: Upload browser evidence
        if: always() && hashFiles('artifacts/ui-verification/p34-pinned-ci/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: p34-browser-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ui-verification/p34-pinned-ci/
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated local candidate
        if: always()
        run: |
          if test -f /tmp/scrimed-p34-browser-server.pid; then
            kill "$(cat /tmp/scrimed-p34-browser-server.pid)" 2>/dev/null || true
          fi
